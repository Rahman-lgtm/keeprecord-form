<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Report Page</title>
  <style>
    * {
    box-sizing: border-box;
}

body {
    font-family: "Bookman Old Style", serif;
    background: #ffffff;
    padding: 20px;
    margin: 0;
}

/* ✅ CONTAINER 60% CENTER */
.container {
    width: 60%;
    margin: auto;
}

/* ✅ TITLE FIXED (NOT SCROLL) */
.title {
    position: sticky;
    top: 0;
    background: #fff;
    text-align: center;
    padding: 10px;
    margin-top: 0;   /* 🔥 gap remove */
    z-index: 10;
    
}

/* ✅ TABLE WRAPPER SCROLL ONLY */
.table-wrapper {
    height: 80vh;           /* full visible area */
    overflow-y: auto;
    border: 1px solid #ccc;
    margin-top: -15px;
}

/* ✅ TABLE FIX */
table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;   /* 🔥 MOST IMPORTANT FIX */
}

/* ✅ HEADER STICKY */
thead th {
    position: sticky;
    top: 0;
    background: #4f77b5;
    font-size: 13px;
    color: white;
    z-index: 15;
    padding: 10px;
    border: 1px solid #2f5597;
}

/* BODY */
tbody td {
    padding: 8px;
    border: 1px solid #8ea9db;
    text-align: center;
    font-size: 11px;
}

/* ZEBRA */
tbody tr:nth-child(odd) { background: #d9e1f2; }
tbody tr:nth-child(even) { background: #fff; }

/* FOOTER STICKY */
tfoot td {
    position: sticky;
    bottom: 0;
    background: #eee;
    font-weight: bold;
    text-align: center;
    z-index: 10;
}

/* ALIGN */
td:nth-child(3) {
    text-align: left;
}

/* ✅ COLUMN WIDTHS (NOW WORK PROPERLY) */
th:nth-child(1), td:nth-child(1) { width: 5%; }
th:nth-child(2), td:nth-child(2) { width: 10%; }
th:nth-child(3), td:nth-child(3) { width: 30%; } /* BIG */
th:nth-child(4), td:nth-child(4) { width: 10%; }
th:nth-child(5), td:nth-child(5) { width: 10%; }  /* SMALL */
th:nth-child(6), td:nth-child(6) { width: 10%; }


/* TEXT CONTROL */
td, th {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.loading {
    position: fixed;   /* 🔥 screen ke sath fix rahega */
    top: 10px;
    right: 20px;    
    color: #27ae60;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;   
    z-index: 999;}
    .loading {
    animation: blink 1s infinite;
}

@keyframes blink {
    0%,100% { opacity: 1; }
    50% { opacity: 0.4; }
}
/* BUTTON */
.download-btn {
    display: block;
    margin: 20px auto;
    padding: 10px 25px;
    background: #28a745;
    color: #000;
    border: none;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
}
  </style>
</head>
<body>

<div class="container">
  <div class="loading" id="loading">Loading.......</div>

  <table id="reportTable">
    <thead>
      <tr>
        <th>Sl No</th>
        <th>GP Name/Ward No</th>
        <th>New RC count</th>
        <th>New Units</th>
        <th>Add Units</th>
        <th>Total Units</th>
      </tr>
    </thead>

    <tbody id="tableBody">
      <!-- Data yaha aayega -->
    </tbody>

    <tfoot>
      <tr class="grand">
        <td colspan="2">Grand Total</td>
        <td id="totalRC">0</td>
        <td id="totalNew">0</td>
        <td id="totalAdd">0</td>
        <td id="totalUnits">0</td>
      </tr>
    </tfoot>
  </table>

  <button class="btn" onclick="downloadCSV()">Download</button>
</div>

<script>
async function loadData() {
  const loading = document.getElementById("loading");
  const tbody = document.getElementById("tableBody");

  try {
    loading.innerText = "Loading.......";

    // ✅ correct API endpoint
    const res = await fetch("/api/gpwise");

    if (!res.ok) {
      throw new Error("API error");
    }

    const data = await res.json();

    // ✅ table clear (reload issue fix)
    tbody.innerHTML = "";

    let totalRC = 0, totalNew = 0, totalAdd = 0, totalUnits = 0;

    data.forEach((row, index) => {
      const tr = document.createElement("tr");

      const rc = Number(row.rc) || 0;
      const newUnits = Number(row.new_units) || 0;
      const addUnits = Number(row.add_units) || 0;
      const total = Number(row.total_units) || 0;

      tr.innerHTML = `
        <td>${index + 1}</td>
        <td>${row.gp || "-"}</td>
        <td>${rc}</td>
        <td>${newUnits}</td>
        <td>${addUnits}</td>
        <td>${total}</td>
      `;

      tbody.appendChild(tr);

      totalRC += rc;
      totalNew += newUnits;
      totalAdd += addUnits;
      totalUnits += total;
    });

    // ✅ totals update
    document.getElementById("totalRC").innerText = totalRC;
    document.getElementById("totalNew").innerText = totalNew;
    document.getElementById("totalAdd").innerText = totalAdd;
    document.getElementById("totalUnits").innerText = totalUnits;

    loading.innerText = "✅ Loaded";

  } catch (err) {
    console.error(err);
    loading.innerText = "❌ Error loading data";
  }
}

function downloadCSV() {
  let csv = [];
  let rows = document.querySelectorAll("table tr");

  rows.forEach(row => {
    let cols = row.querySelectorAll("td, th");
    let rowData = [];

    cols.forEach(col => {
      let text = col.innerText.replace(/,/g, ""); // ✅ comma issue fix
      rowData.push(text);
    });

    csv.push(rowData.join(","));
  });

  let blob = new Blob([csv.join("\n")], { type: "text/csv" });
  let url = window.URL.createObjectURL(blob);

  let a = document.createElement("a");
  a.href = url;
  a.download = "gpwise-report.csv";
  a.click();
}

// ✅ page load pe run karo
document.addEventListener("DOMContentLoaded", loadData);
</script>

</body>
</html>
