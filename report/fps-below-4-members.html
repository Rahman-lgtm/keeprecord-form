<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Below 4 members</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: "Bookman Old Style", serif;
    background: #ffffff;
    margin: 0;
    padding: 20px;
}

/* CONTAINER */
.container {
    width: 65%;
    margin: auto;
}

/* TITLE */
.title {
    position: sticky;
    top: 0;
    background: #fff;
    text-align: center;
    padding: 10px;
    margin: 0;
    z-index: 20;
}

/* TABLE WRAPPER (IMPORTANT FIX) */
.table-wrapper {
    height: 80vh;
    overflow-y: auto;
    border: 1px solid #ccc;
}

/* TABLE */
table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
}

/* HEADER */
thead th {
    position: sticky;
    top: 0;
    background: #4f77b5;
    color: #fff;
    font-size: 13px;
    padding: 16px;
    border: 1px solid #2f5597;
    z-index: 15;
}

/* BODY */
tbody td {
    padding: 8px;
    border: 1px solid #8ea9db;
    text-align: center;
    font-size: 11px;
}

/* ZEBRA */
tbody tr:nth-child(odd) { background: #d9e1f2; }
tbody tr:nth-child(even) { background: #fff; }

/* FOOTER */
tfoot td {
    position: sticky;
    bottom: 0;
    background: #eee;
    font-weight: bold;
    z-index: 10;
    text-align: center;
}
tfoot td:nth-child(4) {
    text-align: center !important;
}
/* ALIGN */
tbody td:nth-child(3) {
    text-align: left;
}

/* COLUMN WIDTH */
th:nth-child(1), td:nth-child(1) { width: 6%; }
th:nth-child(2), td:nth-child(2) { width: 10%; }
th:nth-child(3), td:nth-child(3) { width: 18%; }
th:nth-child(4), td:nth-child(4) { width: 10%; }
th:nth-child(5), td:nth-child(5) { width: 10%; }
th:nth-child(6), td:nth-child(6) { width: 10%; }
th:nth-child(7), td:nth-child(7) { width: 10%; }


/* TEXT CONTROL */
td, th {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* LOADING */
.loading {
    position: fixed;
    top: 10px;
    right: 20px;
    color: #27ae60;
    font-size: 13px;
    font-weight: 600;
    animation: blink 1s infinite;
    z-index: 999;
}

@keyframes blink {
    0%,100% { opacity: 1; }
    50% { opacity: 0.4; }
}

/* BUTTON */
.btn {
    display: block;
    margin: 20px auto;
    padding: 10px 25px;
    background: #28a745;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
}

.btn:hover {
    background: #218838;
}

/* MOBILE */
@media (max-width: 768px) {
    .container {
        width: 95%;
    }
}
</style>
</head>

<body>

<div class="loading" id="loading">Loading.......</div>

<div class="container">
<h1 class="title">FPS Wise Report (Below 4 Members - RC)</h1>
<div class="table-wrapper"> <!-- 🔥 IMPORTANT -->
<table>
<thead>
<tr>
  <th rowspan="2">Sl No</th>
  <th rowspan="2">FPS ID</th>
  <th rowspan="2">Name of FPS</th>

  <th colspan="2">Below 4 members Family</th>
  <th colspan="2">Above 4 members Family</th>
</tr>

<tr>
  <th>New RC count</th>
  <th>New Units</th>
  <th>New RC count</th>
  <th>New Units</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>

<tfoot>
<tr>
  <td colspan="3">Grand Total</td>

  <td id="totalBelowRC">0</td>
  <td id="totalBelowUnits">0</td>

  <td id="totalAboveRC">0</td>
  <td id="totalAboveUnits">0</td>
</tr>
</tfoot>
</table>
</div>

<button class="btn" onclick="downloadCSV()">Download</button>
</div>

</body>
</html>
<script>
async function loadData() {
  const loading = document.getElementById("loading");
  const tbody = document.getElementById("tableBody");

  try {
    loading.innerText = "Loading.......";

    const res = await fetch("/api/fps-below-4-members");

    if (!res.ok) {
      throw new Error("API error");
    }

    const data = await res.json();

    // clear table
    tbody.innerHTML = "";

    let totalRC = 0;
    let totalUnits = 0;

    data.forEach((row, index) => {
      const tr = document.createElement("tr");

      const rc = Number(row.rc) || 0;
      const units = Number(row.new_units) || 0;

      tr.innerHTML = `
  <td>${index + 1}</td>
  <td>${row.fps_id || "-"}</td>
  <td>${row.fps_name || "-"}</td>

  <td>${row.below_rc}</td>
  <td>${row.below_units}</td>

  <td>${row.above_rc}</td>
  <td>${row.above_units}</td>
`;

      tbody.appendChild(tr);

      totalRC += rc;
      totalUnits += units;
    });

    // ✅ totals
    let totalBelowRC = 0;
let totalBelowUnits = 0;
let totalAboveRC = 0;
let totalAboveUnits = 0;

data.forEach((row, index) => {

  const tr = document.createElement("tr");

  tr.innerHTML = `
    <td>${index + 1}</td>
    <td>${row.fps_id || "-"}</td>
    <td>${row.fps_name || "-"}</td>

    <td>${row.below_rc}</td>
    <td>${row.below_units}</td>

    <td>${row.above_rc}</td>
    <td>${row.above_units}</td>
  `;

  tbody.appendChild(tr);

  // 🔥 totals yaha hi update karo
  totalBelowRC += Number(row.below_rc) || 0;
  totalBelowUnits += Number(row.below_units) || 0;
  totalAboveRC += Number(row.above_rc) || 0;
  totalAboveUnits += Number(row.above_units) || 0;
});

    loading.innerText = "";

  } catch (err) {
    console.error(err);
    loading.innerText = "❌ Error loading data";
  }
}

function downloadCSV() {
  let csv = [];
  let rows = document.querySelectorAll("table tr");

  rows.forEach(row => {
    let cols = row.querySelectorAll("td, th");
    let rowData = [];

    cols.forEach(col => {
      let text = col.innerText.replace(/,/g, "");
      rowData.push(text);
    });

    csv.push(rowData.join(","));
  });

  let blob = new Blob([csv.join("\n")], { type: "text/csv" });
  let url = window.URL.createObjectURL(blob);

  let a = document.createElement("a");
  a.href = url;
  a.download = "fpswise-report.csv";
  a.click();
}

// run
document.addEventListener("DOMContentLoaded", loadData);
</script>

</body>
</html>
