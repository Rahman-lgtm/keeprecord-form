<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FPS Report</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: "Bookman Old Style", serif;
    background: #ffffff;
    padding: 20px;
}

/* CONTAINER */
.container {
    width: min(95%, 1200px);
    margin: auto;
}

/* TITLE */
.title {
    text-align: center;
    margin-bottom: 15px;
}

/* TABLE WRAPPER */
.table-wrapper {
    height: calc(100vh - 180px); /* 🔥 full screen height */
    overflow-y: auto;
    border: 1px solid #ccc;
}

/* TABLE */
table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
}

/* 🔥 STICKY HEADER */
thead th {
    position: sticky;
    top: 0;
    background: #4f77b5;
    color: white;
    z-index: 10;
    padding: 10px;
    border: 1px solid #2f5597;
}

/* BODY */
tbody td {
    padding: 8px;
    border: 1px solid #8ea9db;
    text-align: center;
}

/* ZEBRA */
tbody tr:nth-child(odd) { background: #d9e1f2; }
tbody tr:nth-child(even) { background: #fff; }

/* FOOTER */
tfoot td {
    background: #d9e1f2;
    font-weight: bold;
    border: 1px solid #2f5597;
    text-align: center;   /* 🔥 center align */
}

/* ALIGNMENTS */
td:nth-child(2), td:nth-child(3) {
    text-align: center;
}
.loading {
    position: absolute;
    top: 20px;
    right: 25px;
    color: #27ae60;
    font-size: 14px;
    font-weight: 500;
    z-index: 20;
    animation: pulse 2s infinite;
}

@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
}

/* BUTTON */
.download-btn {
    display: block;
    margin: 20px auto;
    padding: 10px 25px;
    background: #28a745;
    color: #000;
    border: none;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
}
</style>
</head>

<body>
<div class="container">
    <!-- LOADING -->
    <div class="loading" id="loadingText">Loading Report...</div>
<h1 class="title">📊 FPS Data Entry Report - Agent Wise</h1>

<div class="table-wrapper">

<table id="reportTable">
<thead>
<tr>
<th>Sl No</th>
<th>FPS ID</th>
<th>FPS Name</th>
<th>New RC count</th>
<th>New Units</th>
<th>Add units</th>
<th>Total Units</th>
<th>Ratio</th>
</tr>
</thead>

<tbody id="tableBody"></tbody>

<tfoot>
<tr>
<td colspan="3">Grand Total</td>
<td id="tNewCount">0</td>
<td id="tNewUnits">0</td>
<td id="tAddUnits">0</td>
<td id="tTotalUnits">0</td>
<td>-</td>
</tr>
</tfoot>

</table>
</div>

<button class="download-btn" id="downloadBtn">Download</button>

</div>

<script>
document.addEventListener('DOMContentLoaded', function() {

fetch("/api/report")
.then(res => res.json())
.then(data => {

let fpsData = {};
let index = 1;

data.forEach(row => {
    let id = row["F.P.S Code 13050050......."];
    let name = row["FPS Name"];
    let type = row["Application type (NEW or ADD RC)"];
    let members = parseInt(row["Total Number of included Members"]) || 0;

    if (!id) return;

    type = type ? type.toUpperCase().trim() : "";

    if (!fpsData[id]) {
        fpsData[id] = {
            name,
            newCount: 0,
            newUnits: 0,
            addUnits: 0,
            totalUnits: 0
        };
    }

    if (type.includes("NEW")) {
        fpsData[id].newCount++;
        fpsData[id].newUnits += members;
        fpsData[id].totalUnits += members;
    }

    if (type.includes("ADD")) {
        fpsData[id].addUnits += members;
        fpsData[id].totalUnits += members;
    }
});

let tNewCount=0, tNewUnits=0, tAddUnits=0, tTotal=0;

Object.entries(fpsData)
.sort((a,b)=>b[1].totalUnits-a[1].totalUnits)
.forEach(([id,val])=>{

let ratio = val.newCount ? (val.totalUnits/val.newCount).toFixed(1) : "-";

tNewCount+=val.newCount;
tNewUnits+=val.newUnits;
tAddUnits+=val.addUnits;
tTotal+=val.totalUnits;

document.getElementById("tableBody").innerHTML += `
<tr>
<td>${index++}</td>
<td>${id}</td>
<td>${val.name}</td>
<td>${val.newCount}</td>
<td>${val.newUnits}</td>
<td>${val.addUnits}</td>
<td><b>${val.totalUnits}</b></td>
<td>${ratio}</td>
</tr>`;
});

document.getElementById("tNewCount").innerText=tNewCount;
document.getElementById("tNewUnits").innerText=tNewUnits;
document.getElementById("tAddUnits").innerText=tAddUnits;
document.getElementById("tTotalUnits").innerText=tTotal;

});
});
 // Hide loading, show download
        document.getElementById("loadingText").style.display = "none";
        document.getElementById("downloadBtn").style.display = "inline-flex";
    })
    .catch(error => {
        console.error('Error:', error);
        document.getElementById("loadingText").textContent = "Error loading data";
        document.getElementById("loadingText").style.color = "#e74c3c";
    });
});

// DOWNLOAD
document.getElementById("downloadBtn").onclick = function(){
let table = document.getElementById("reportTable").outerHTML;
let blob = new Blob([table], {type:"application/vnd.ms-excel"});
let a = document.createElement("a");
a.href = URL.createObjectURL(blob);
a.download = "FPS_Report.xls";
a.click();
};
</script>

</body>
</html>
