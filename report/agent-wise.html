<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FPS Report</title>

<style>
/* BODY */
body {
    font-family: "Bookman Old Style", serif;
    background: white;
    margin: 0;
    height: 80vh;
    overflow: hidden;   /* ❌ page scroll band */
}

/* TITLE */
.title {
    text-align: center;
    margin: 1px 0 5px 0;
    font-size: 26px;
    font-weight: bold;
    color: #6b3e26;
}

/* CONTAINER */
.container {
    width: 70%;
    max-width: 1100px;
    margin: 10px auto;

    padding: 15px;
    padding-bottom: 70px; /* button space */

    background: #d3d3d3;
    border-radius: 10px;
    box-shadow: 8px 8px 20px rgba(0,0,0,0.3);

    position: relative;

    height: calc(100vh - 20px);  /* ✅ full fit */
    display: flex;
    flex-direction: column;
}

/* LOADING */
.loading {
    position: absolute;
    top: 5px;
    right: 15px;
    color: green;
    font-size: 14px;
}

/* DOWNLOAD BUTTON */
.download-btn {
    display: none;

    position: absolute;
    bottom: 15px;
    left: 50%;
    transform: translateX(-50%);

    background: #4CAF50;
    color: white;
    border: none;
    padding: 8px 18px;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.3s;
}
.download-btn:hover {
    background: #2e7d32;
}

/* TABLE WRAPPER (ONLY SCROLL AREA) */
.table-wrapper {
    flex: 1;
    overflow-y: auto;   /* ✅ vertical scroll */
    overflow-x: auto;
}

/* TABLE */
table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
    background: #d3d3d3;
}

/* HEADER FIX */
thead th {
    position: sticky;
    top: 0;
    background: #8b5e3c;
    color: white;
    z-index: 3;   /* ✅ always top */
}

/* FOOTER FIX (TOTAL ROW) */
tfoot th {
    position: sticky;
    bottom: 0;
    background: #8b5e3c;
    color: white;
    z-index: 3;   /* ✅ always visible */
}

/* CELL */
th, td {
    border: 1px solid black;
    padding: 6px;
    text-align: center;
}

/* COLUMN WIDTHS */
th:nth-child(1), td:nth-child(1) {
    width: 40px;
}

th:nth-child(2), td:nth-child(2) {
    width: 80px;
    white-space: nowrap;
}

th:nth-child(3), td:nth-child(3) {
    width: 240px;
    word-break: break-word;
    text-align: left;
}

th:not(:nth-child(2)):not(:nth-child(3)),
td:not(:nth-child(2)):not(:nth-child(3)) {
    width: 60px;
}

/* ROW HOVER */
tbody tr:hover {
    background: #c8e6c9;
}
</style>
</head>

<body>

<div class="container">

    <!-- LOADING -->
    <div class="loading" id="loadingText">Loading.......</div>

    <!-- TITLE -->
    <h1 class="title">Data Entry Report Agent Wise</h1>

    <!-- TABLE AREA -->
    <div class="table-wrapper">
        <table id="reportTable">

            <thead>
                <tr>
                    <th>Sl No</th>
                    <th>FPS ID</th>
                    <th>FPS Name</th>
                    <th>New RC count</th>
                    <th>New Units</th>
                    <th>Add units</th>
                    <th>Total Units</th>
                    <th>Ratio</th>
                </tr>
            </thead>

            <tbody id="tableBody">
                <!-- Dynamic data -->
            </tbody>

            <tfoot>
                <tr>
                    <th colspan="3">TOTAL</th>
                    <th id="tNewCount">0</th>
                    <th id="tNewUnits">0</th>
                    <th id="tAddUnits">0</th>
                    <th id="tTotalUnits">0</th>
                    <th>-</th>
                </tr>
            </tfoot>

        </table>
    </div>

    <!-- BUTTON (ALWAYS LAST) -->
    <button class="download-btn" id="downloadBtn">Download</button>

</div>

<script>

const url = "https://script.google.com/macros/s/AKfycbxUUuOfgvi5n0ltz6BjsLaBDKze3c56T7RNncBC_NzvurYwIPE5iSMPxZqnRQLMsRBE/exec?key=mySecret1774123";

fetch(url)
.then(res => res.json())
.then(data => {

    let fpsData = {};
    let index = 1;

    data.forEach(row => {

        let id = row["F.P.S Code 13050050......."];
        let name = row["FPS Name"];
        let type = row["Application type (NEW or ADD RC)"];
        let members = parseInt(row["Total Number of included Members"]) || 0;

        if (!id) return;

        type = type ? type.toString().toUpperCase().trim() : "";

        if (!fpsData[id]) {
            fpsData[id] = {
                name: name,
                newCount: 0,
                newUnits: 0,
                addUnits: 0,
                totalUnits: 0
            };
        }

        if (type.includes("NEW")) {
            fpsData[id].newCount++;
            fpsData[id].newUnits += members;
            fpsData[id].totalUnits += members;
        }

        if (type.includes("ADD")) {
            fpsData[id].addUnits += members;
            fpsData[id].totalUnits += members;
        }

    });

    let totalNewCount = 0;
    let totalNewUnits = 0;
    let totalAddUnits = 0;
    let totalUnitsAll = 0;

    let tableBody = document.getElementById("tableBody");

    Object.entries(fpsData)
    .sort((a, b) => b[1].totalUnits - a[1].totalUnits)
    .forEach(([id, val]) => {

        let ratio = val.newCount ? (val.totalUnits / val.newCount).toFixed(2) : 0;

        totalNewCount += val.newCount;
        totalNewUnits += val.newUnits;
        totalAddUnits += val.addUnits;
        totalUnitsAll += val.totalUnits;

        let row = `
        <tr>
            <td>${index++}</td>
            <td>${id}</td>
            <td>${val.name || ""}</td>
            <td>${val.newCount}</td>
            <td>${val.newUnits}</td>
            <td>${val.addUnits}</td>
            <td>${val.totalUnits}</td>
            <td>${ratio}</td>
        </tr>
        `;

        tableBody.innerHTML += row;
    });

    // TOTAL UPDATE
    document.getElementById("tNewCount").innerText = totalNewCount;
    document.getElementById("tNewUnits").innerText = totalNewUnits;
    document.getElementById("tAddUnits").innerText = totalAddUnits;
    document.getElementById("tTotalUnits").innerText = totalUnitsAll;

    document.getElementById("loadingText").style.display = "none";
    document.getElementById("downloadBtn").style.display = "block";

});

// DOWNLOAD
document.getElementById("downloadBtn").addEventListener("click", function () {
    let table = document.getElementById("reportTable").outerHTML;
    let blob = new Blob([table], { type: "application/vnd.ms-excel" });
    let url = URL.createObjectURL(blob);
    let a = document.createElement("a");
    a.href = url;
    a.download = "FPS_Report.xls";
    a.click();
});

</script>

</body>
</html>
