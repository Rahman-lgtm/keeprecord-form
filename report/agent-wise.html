<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FPS Report</title>

<style>
/* RESET */
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    height: 100%;
}

/* BODY */
body {
    font-family: "Bookman Old Style", serif;
    background: white;
    min-height: 100dvh;
    overflow: hidden; /* full page scroll band */
    display: flex;
    flex-direction: column;
}

/* TITLE */
.title {
    text-align: center;
    margin: 6px 0 8px;
    font-size: 26px;
    font-weight: bold;
    color: #6b3e26;
    flex: 0 0 auto;
}

/* CONTAINER */
.container { width: min(70%, 1100px); margin: 0 auto 10px; padding: 15px; background: #d3d3d3; border-radius: 10px; box-shadow: 8px 8px 20px rgba(0, 0, 0, 0.3); position: relative; flex: 1; min-height: 0; /* IMPORTANT for inner scrolling */ display: flex; flex-direction: column; overflow: hidden; /* only table-wrapper should scroll */ }

/* LOADING */
.loading {
    position: absolute;
    top: 8px;
    right: 15px;
    color: green;
    font-size: 14px;
    z-index: 20;
}

/* TABLE WRAPPER - ONLY SCROLL AREA */
.table-wrapper {
    flex: 1;
    min-height: 0;
    overflow: auto;
}

/* TABLE */
table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
    background: #d3d3d3;
}

/* HEADER */
thead th {
    position: sticky;
    top: 0;
    background: #8b5e3c;
    color: white;
    z-index: 3;
}

/* FOOTER / TOTAL ROW */
tfoot th,
tfoot td {
    position: static;   /* 🔥 FIX */
    background: #8b5e3c;
    color: white;
}

/* CELLS */
th, td {
    border: 1px solid black;
    padding: 6px;
    text-align: center;
    vertical-align: middle;
}

/* COLUMN WIDTHS */
th:nth-child(1), td:nth-child(1) {
    width: 40px;
}

th:nth-child(2), td:nth-child(2) {
    width: 80px;
    white-space: nowrap;
}

th:nth-child(3), td:nth-child(3) {
    width: 240px;
    word-break: break-word;
    text-align: left;
}

th:not(:nth-child(1)):not(:nth-child(2)):not(:nth-child(3)),
td:not(:nth-child(1)):not(:nth-child(2)):not(:nth-child(3)) {
    width: 60px;
}

/* ROW HOVER */
tbody tr:hover {
    background: #c8e6c9;
}
.total-row .col3 {
    text-align: center;
}
/* DOWNLOAD BUTTON */
.download-btn {
    margin-top: 10px;
    align-self: center;

    display: inline-block;
    padding: 10px 18px;
    border: none;
    border-radius: 6px;
    background: #4CAF50;
    color: white;
    font-size: 14px;
    cursor: pointer;
}
.download-btn:hover {
    background: #2e7d32;
}

/* OPTIONAL SCROLLBAR STYLING */
.table-wrapper::-webkit-scrollbar {
    width: 10px;
    height: 10px;
}

.table-wrapper::-webkit-scrollbar-thumb {
    background: #8b5e3c;
    border-radius: 10px;
}

.table-wrapper::-webkit-scrollbar-track {
    background: #e0e0e0;
}

/* MOBILE / SMALL SCREEN */
@media (max-width: 768px) {
    .container {
        width: 96%;
        padding: 10px;
        margin-bottom: 6px;
    }

    .title {
        font-size: 20px;
        margin: 6px 0;
    }

    th, td {
        padding: 5px;
        font-size: 12px;
    }

    .download-btn {
        font-size: 13px;
        padding: 8px 14px;
    }
}
   
.total-row .col {
    border: 1px solid black;
    padding: 6px;
    text-align: center;
}

.total-row .col3 {
    text-align: left;
}
</style>
</head>

<body>

<div class="container">

    <!-- LOADING -->
    <div class="loading" id="loadingText">Loading.......</div>

    <!-- TITLE -->
    <h1 class="title">Data Entry Report Agent Wise</h1>

    <!-- TABLE AREA -->
    <div class="table-wrapper">
        <table id="reportTable">

            <thead>
                <tr>
                    <th>Sl No</th>
                    <th>FPS ID</th>
                    <th>FPS Name</th>
                    <th>New RC count</th>
                    <th>New Units</th>
                    <th>Add units</th>
                    <th>Total Units</th>
                    <th>Ratio</th>
                </tr>
            </thead>

            <tbody id="tableBody">
                <!-- Dynamic data -->
           </tbody>
</table>
</div>

<!-- ✅ TOTAL ROW (FULL COLUMN MATCH) -->
<div class="total-row">

    <div class="col col1"></div> <!-- Sl No empty -->
    <div class="col col2"></div> <!-- FPS ID empty -->

    <div class="col col3">TOTAL</div>

    <div class="col" id="tNewCount">0</div>
    <div class="col" id="tNewUnits">0</div>
    <div class="col" id="tAddUnits">0</div>
    <div class="col" id="tTotalUnits">0</div>
    <div class="col">-</div>

</div>

<!-- DOWNLOAD BUTTON -->
<button class="download-btn" id="downloadBtn">Download</button>
<script>


fetch("/.netlify/functions/report")
.then(res => res.json())
.then(data => {

    let fpsData = {};
    let index = 1;

    data.forEach(row => {

        let id = row["F.P.S Code 13050050......."];
        let name = row["FPS Name"];
        let type = row["Application type (NEW or ADD RC)"];
        let members = parseInt(row["Total Number of included Members"]) || 0;

        if (!id) return;

        type = type ? type.toString().toUpperCase().trim() : "";

        if (!fpsData[id]) {
            fpsData[id] = {
                name: name,
                newCount: 0,
                newUnits: 0,
                addUnits: 0,
                totalUnits: 0
            };
        }

        if (type.includes("NEW")) {
            fpsData[id].newCount++;
            fpsData[id].newUnits += members;
            fpsData[id].totalUnits += members;
        }

        if (type.includes("ADD")) {
            fpsData[id].addUnits += members;
            fpsData[id].totalUnits += members;
        }

    });

    let totalNewCount = 0;
    let totalNewUnits = 0;
    let totalAddUnits = 0;
    let totalUnitsAll = 0;

    let tableBody = document.getElementById("tableBody");

    Object.entries(fpsData)
    .sort((a, b) => b[1].totalUnits - a[1].totalUnits)
    .forEach(([id, val]) => {

        let ratio = val.newCount ? (val.totalUnits / val.newCount).toFixed(2) : 0;

        totalNewCount += val.newCount;
        totalNewUnits += val.newUnits;
        totalAddUnits += val.addUnits;
        totalUnitsAll += val.totalUnits;

        let row = `
        <tr>
            <td>${index++}</td>
            <td>${id}</td>
            <td>${val.name || ""}</td>
            <td>${val.newCount}</td>
            <td>${val.newUnits}</td>
            <td>${val.addUnits}</td>
            <td>${val.totalUnits}</td>
            <td>${ratio}</td>
        </tr>
        `;

        tableBody.innerHTML += row;
    });

    // TOTAL UPDATE
    document.getElementById("tNewCount").innerText = totalNewCount;
    document.getElementById("tNewUnits").innerText = totalNewUnits;
    document.getElementById("tAddUnits").innerText = totalAddUnits;
    document.getElementById("tTotalUnits").innerText = totalUnitsAll;

    document.getElementById("loadingText").style.display = "none";
    document.getElementById("downloadBtn").style.display = "block";

});

// DOWNLOAD
document.getElementById("downloadBtn").addEventListener("click", function () {
    let table = document.getElementById("reportTable").outerHTML;
    let blob = new Blob([table], { type: "application/vnd.ms-excel" });
    let url = URL.createObjectURL(blob);
    let a = document.createElement("a");
    a.href = url;
    a.download = "FPS_Report.xls";
    a.click();
});

</script>

</body>
</html>
