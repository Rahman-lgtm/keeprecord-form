<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FPS Report</title>

<style>

body {
    font-family: "Bookman Old Style", serif;
    background: #b7dfb9;
    margin: 0;
}

/* CONTAINER */
.container {
    width: 90%;
    margin: 40px auto;
    background: #d3d3d3;
    padding: 15px;
    border-radius: 10px;
    box-shadow: 8px 8px 20px rgba(0,0,0,0.3);
    position: relative;
}

/* LOADING */
.loading {
    position: absolute;
    top: 5px;
    right: 15px;
    color: green;
    font-size: 14px;
}

/* DOWNLOAD BUTTON */
.download-btn {
    display: none;
    position: absolute;
    top: 5px;
    right: 15px;
    background: #e3a373;
    border: none;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
}

/* TABLE WRAPPER */
.table-wrapper {
    max-height: 400px;
    overflow-y: auto;
    overflow-x: auto;
}

/* TABLE */
table {
    width: 100%;
    border-collapse: collapse;
    background: #d3d3d3;
}

/* HEADER FIX */
thead th {
    position: sticky;
    top: 0;
    background: #d3d3d3;
    z-index: 2;
}

/* CELL */
th, td {
    border: 1px solid black;
    padding: 6px;
    text-align: center;
}

/* HEADER FONT */
th {
    font-weight: bold;
}

/* COLUMN WIDTH */
th:nth-child(1) { width: 50px; }
th:nth-child(2) { width: 150px; }
th:nth-child(3) { width: 200px; }

</style>
</head>

<body>

<div class="container">

    <div class="loading" id="loadingText">Loading.......</div>
    <button class="download-btn" id="downloadBtn">Download Excel</button>

    <div class="table-wrapper">
        <table id="reportTable">
            <thead>
                <tr>
                    <th>Sl No</th>
                    <th>FPS ID</th>
                    <th>FPS Name</th>
                    <th>New RC count</th>
                    <th>New Units</th>
                    <th>Add units</th>
                    <th>Total Units</th>
                    <th>Ratio = (Total units / new RC count)</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

</div>

<script>

const url = "https://script.google.com/macros/s/AKfycbxUUuOfgvi5n0ltz6BjsLaBDKze3c56T7RNncBC_NzvurYwIPE5iSMPxZqnRQLMsRBE/exec?key=mySecret1774123";

fetch(url)
.then(res => res.json())
.then(data => {

    let fpsData = {};
    let index = 1;

    data.forEach(row => {

        let id = row["F.P.S Code 13050050......."];
        let name = row["FPS Name"];
        let type = row["Application type (NEW or ADD RC)"];
        let members = parseInt(row["Total Number of included Members"]) || 0;

        if (!id) return;

        type = type ? type.toString().toUpperCase().trim() : "";

        if (!fpsData[id]) {
            fpsData[id] = {
                name: name,
                newCount: 0,
                newUnits: 0,
                addUnits: 0,
                totalUnits: 0
            };
        }

        if (type.includes("NEW")) {
            fpsData[id].newCount += 1;
            fpsData[id].newUnits += members;
            fpsData[id].totalUnits += members;
        }

        if (type.includes("ADD")) {
            fpsData[id].addUnits += members;
            fpsData[id].totalUnits += members;
        }

    });

    let tableBody = document.getElementById("tableBody");

    Object.entries(fpsData).forEach(([id, val]) => {

        let ratio = val.newCount ? (val.totalUnits / val.newCount).toFixed(2) : 0;

        let row = `
        <tr>
            <td>${index++}</td>
            <td>${id}</td>
            <td>${val.name || ""}</td>
            <td>${val.newCount}</td>
            <td>${val.newUnits}</td>
            <td>${val.addUnits}</td>
            <td>${val.totalUnits}</td>
            <td>${ratio}</td>
        </tr>
        `;

        tableBody.innerHTML += row;
    });

    // hide loading
    document.getElementById("loadingText").style.display = "none";

    // show download button
    document.getElementById("downloadBtn").style.display = "block";

});


// DOWNLOAD EXCEL
document.getElementById("downloadBtn").addEventListener("click", function () {

    let table = document.getElementById("reportTable").outerHTML;

    let blob = new Blob([table], { type: "application/vnd.ms-excel" });
    let url = URL.createObjectURL(blob);

    let a = document.createElement("a");
    a.href = url;
    a.download = "FPS_Report.xls";
    a.click();
});

</script>

</body>
</html>
