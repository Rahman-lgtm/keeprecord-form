<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FPS Report</title>

<style>
/* BODY */
body {
    font-family: "Bookman Old Style", serif;
    background: white;
    margin: 0;
}

/* CONTAINER */
.container {
    width: 70%;
    margin: 10px auto;
    background: #d3d3d3;
    padding: 15px;
    border-radius: 10px;
    box-shadow: 8px 8px 20px rgba(0,0,0,0.3);
    position: relative;
}

/* LOADING */
.loading {
    position: absolute;
    top: 5px;
    right: 15px;
    color: green;
    font-size: 14px;
}

/* DOWNLOAD BUTTON */
.download-btn {
    display: none;
    position: absolute;
    top: 5px;
    right: 15px;
    background: #e3a373;
    border: none;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
}

/* TABLE WRAPPER (SCROLL) */
.table-wrapper {
    max-height: 420px;
    overflow-y: auto;
    overflow-x: auto;
}

/* TABLE */
table {
    width: 70%;
    border-collapse: collapse;
    background: #d3d3d3;
    table-layout: fixed;
}

/* HEADER FIX */
thead th {
    position: sticky;
    top: 0;
    background: #8b5e3c;   /* 🔥 brown color */
    color: white;          /* text visible rahe */
    z-index: 2;
}

/* CELL */
th, td {
    border: 1px solid black;
    padding: 6px;
    text-align: center;
    vertical-align: middle;
}
th:nth-child(1), td:nth-child(1) {
    width: 40px;      /* 🔥 kam width */
    min-width: 40px;
    max-width: 40px;
    padding: 4px;     /* 🔥 padding bhi kam */
    font-size: 13px;  /* optional */
}
/* FPS ID column (12 digit) */
th:nth-child(2), td:nth-child(2) {
    width: 140px;
    min-width: 140px;
    white-space: nowrap;
}

/* FPS NAME column (wrap) */
th:nth-child(3), td:nth-child(3) {
    width: 220px;
    min-width: 220px;
    white-space: normal;
    word-break: break-word;
    text-align: left;
    padding-left: 8px;
}

/* बाकी columns fixed */
th:not(:nth-child(2)):not(:nth-child(3)),
td:not(:nth-child(2)):not(:nth-child(3)) {
    width: 60px;
    min-width: 60px;
}

/* HOVER ROW (optional premium feel) */
tbody tr:hover {
    background: #c8e6c9;
}

</style>
</head>

<body>
<div class="loading" id="loadingText">Loading.......</div>
    <button class="download-btn" id="downloadBtn">Download</button>
<div class="container">
    <div class="table-wrapper">
        <table id="reportTable">
            <thead>
                <tr>
                    <th>Sl No</th>
                    <th>FPS ID</th>
                    <th>FPS Name</th>
                    <th>New RC count</th>
                    <th>New Units</th>
                    <th>Add units</th>
                    <th>Total Units</th>
                    <th>Ratio </th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

</div>

<script>

const url = "https://script.google.com/macros/s/AKfycbxUUuOfgvi5n0ltz6BjsLaBDKze3c56T7RNncBC_NzvurYwIPE5iSMPxZqnRQLMsRBE/exec?key=mySecret1774123";

fetch(url)
.then(res => res.json())
.then(data => {

    let fpsData = {};
    let index = 1;

    data.forEach(row => {

        let id = row["F.P.S Code 13050050......."];
        let name = row["FPS Name"];
        let type = row["Application type (NEW or ADD RC)"];
        let members = parseInt(row["Total Number of included Members"]) || 0;

        if (!id) return;

        type = type ? type.toString().toUpperCase().trim() : "";

        if (!fpsData[id]) {
            fpsData[id] = {
                name: name,
                newCount: 0,
                newUnits: 0,
                addUnits: 0,
                totalUnits: 0
            };
        }

        if (type.includes("NEW")) {
            fpsData[id].newCount += 1;
            fpsData[id].newUnits += members;
            fpsData[id].totalUnits += members;
        }

        if (type.includes("ADD")) {
            fpsData[id].addUnits += members;
            fpsData[id].totalUnits += members;
        }

    });

    let tableBody = document.getElementById("tableBody");

Object.entries(fpsData)
.sort((a, b) => b[1].totalUnits - a[1].totalUnits)
.forEach(([id, val]) => {

    let ratio = val.newCount ? (val.totalUnits / val.newCount).toFixed(2) : 0;

    let row = `
    <tr>
        <td>${index++}</td>
        <td>${id}</td>
        <td>${val.name || ""}</td>
        <td>${val.newCount}</td>
        <td>${val.newUnits}</td>
        <td>${val.addUnits}</td>
        <td>${val.totalUnits}</td>
        <td>${ratio}</td>
    </tr>
    `;

    tableBody.innerHTML += row;
});

    // hide loading
    document.getElementById("loadingText").style.display = "none";

    // show download button
    document.getElementById("downloadBtn").style.display = "block";

});


// DOWNLOAD EXCEL
document.getElementById("downloadBtn").addEventListener("click", function () {

    let table = document.getElementById("reportTable").outerHTML;

    let blob = new Blob([table], { type: "application/vnd.ms-excel" });
    let url = URL.createObjectURL(blob);

    let a = document.createElement("a");
    a.href = url;
    a.download = "FPS_Report.xls";
    a.click();
});

</script>

</body>
</html>
