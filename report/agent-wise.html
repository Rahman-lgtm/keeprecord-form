<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FPS Report</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: "Bookman Old Style", serif;
    background: #ffffff;
    padding: 20px;
}

/* CONTAINER */
.container {
    height: 100vh;
    display: flex;
    flex-direction: column;
}

/* TITLE */
.title {
    position: sticky;
    top: 0;
    background: white;
    padding: 8px;
    margin: 0;
    z-index: 20;
}

/* TABLE WRAPPER */
.table-wrapper {
    flex: 1;
    overflow-y: auto;
}

/* TABLE */
table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
}
.table-container {
    max-height: 400px;   /* jitna height chahiye */
    overflow-y: auto;    /* scroll yahi par hoga */
}
/* STICKY HEADER */
thead th {
    position: sticky;
    top: 1px; /* 👈 title height ke hisab se adjust karo */
    background: #4f77b5;
    color: white;
    z-index: 15;
    padding: 6px;
    border: 1px solid #2f5597;
}
/* BODY */
tbody td {
    padding: 5px;
    border: 1px solid #8ea9db;
    text-align: center;
}

/* ZEBRA */
tbody tr:nth-child(odd) { background: #d9e1f2; }
tbody tr:nth-child(even) { background: #fff; }

/* FOOTER */
tfoot td {
    position: sticky;
    bottom: 0;
    background: #eee;
    font-weight: bold;
    z-index: 10;
}

/* ALIGN */
td:nth-child(2) {
    text-align: center;
}
td:nth-child(3) {text-align: left;
}
/* ✅ ONLY COLUMN WIDTHS (as you wanted) */
th:nth-child(1), td:nth-child(1) { width: 3%; text-align: center;}
th:nth-child(2), td:nth-child(2) { width: 7%; text-align: center; }
th:nth-child(3), td:nth-child(3) { width: 22%; text-align: left;}
th:nth-child(4), td:nth-child(4) { width: 7%; text-align: center;}
th:nth-child(5), td:nth-child(5) { width: 7%; text-align: center; }
th:nth-child(6), td:nth-child(6) { width: 7%; text-align: center;}
th:nth-child(7), td:nth-child(7) { width: 7%; font-weight: 600; text-align: center; }
th:nth-child(8), td:nth-child(8) { width: 7%; text-align: center; }

/* LOADING */
.loading {
    position: absolute;
    top: 20px;
    right: 25px;
    color: #27ae60;
    font-size: 14px;
    font-weight: 500;
}

/* BUTTON */
.download-btn {
    display: block;
    margin: 20px auto;
    padding: 10px 25px;
    background: #28a745;
    color: #000;
    border: none;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="container">

<div class="loading" id="loadingText">Loading Report...</div>

<h1 class="title">📊 FPS Data Entry Report - Agent Wise</h1>

<div class="table-wrapper">

<table id="reportTable">
<thead>
<tr>
<th>Sl No</th>
<th>FPS ID</th>
<th>FPS Name</th>
<th>New RC count</th>
<th>New Units</th>
<th>Add units</th>
<th>Total Units</th>
<th>Ratio</th>
</tr>
</thead>

<tbody id="tableBody"></tbody>

<tfoot>
<tr>
<td colspan="3">Grand Total</td>
<td id="tNewCount">0</td>
<td id="tNewUnits">0</td>
<td id="tAddUnits">0</td>
<td id="tTotalUnits">0</td>
<td>-</td>
</tr>
</tfoot>

</table>
</div>

<button class="download-btn" id="downloadBtn">Download</button>

</div>

<script>
document.addEventListener('DOMContentLoaded', function() {

fetch("/api/report")
.then(res => res.json())
.then(data => {

let fpsData = {};
let index = 1;

data.forEach(row => {
    let id = row["F.P.S Code 13050050......."];
    let name = row["FPS Name"];
    let type = row["Application type (NEW or ADD RC)"];
    let members = parseInt(row["Total Number of included Members"]) || 0;

    if (!id) return;

    type = type ? type.toUpperCase().trim() : "";

    if (!fpsData[id]) {
        fpsData[id] = {
            name,
            newCount: 0,
            newUnits: 0,
            addUnits: 0,
            totalUnits: 0
        };
    }

    if (type.includes("NEW")) {
        fpsData[id].newCount++;
        fpsData[id].newUnits += members;
        fpsData[id].totalUnits += members;
    }

    if (type.includes("ADD")) {
        fpsData[id].addUnits += members;
        fpsData[id].totalUnits += members;
    }
});

let tNewCount=0, tNewUnits=0, tAddUnits=0, tTotal=0;

Object.entries(fpsData)
.sort((a,b)=>b[1].totalUnits-a[1].totalUnits)
.forEach(([id,val])=>{

let ratio = val.newCount ? (val.totalUnits/val.newCount).toFixed(1) : "-";

tNewCount+=val.newCount;
tNewUnits+=val.newUnits;
tAddUnits+=val.addUnits;
tTotal+=val.totalUnits;

document.getElementById("tableBody").innerHTML += `
<tr>
<td>${index++}</td>
<td>${id}</td>
<td>${val.name}</td>
<td>${val.newCount}</td>
<td>${val.newUnits}</td>
<td>${val.addUnits}</td>
<td><b>${val.totalUnits}</b></td>
<td>${ratio}</td>
</tr>`;
});

document.getElementById("tNewCount").innerText=tNewCount;
document.getElementById("tNewUnits").innerText=tNewUnits;
document.getElementById("tAddUnits").innerText=tAddUnits;
document.getElementById("tTotalUnits").innerText=tTotal;

// ✅ FIXED loading hide
document.getElementById("loadingText").style.display = "none";

})
.catch(error => {
    console.error('Error:', error);
    document.getElementById("loadingText").textContent = "Error loading data";
    document.getElementById("loadingText").style.color = "#e74c3c";
});

});

// DOWNLOAD
document.getElementById("downloadBtn").onclick = function(){
let table = document.getElementById("reportTable").outerHTML;
let blob = new Blob([table], {type:"application/vnd.ms-excel"});
let a = document.createElement("a");
a.href = URL.createObjectURL(blob);
a.download = "FPS_Report.xls";
a.click();
};
</script>

</body>
</html>
