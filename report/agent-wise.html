<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FPS Report</title>

<style>
body {
    font-family: "Bookman Old Style", serif;
    background: #dcdcdc;
    margin: 0;
}

/* MAIN BOX */
.container {
    max-width: 95%;
    margin: 30px auto;
    background: #cfcfcf;
    padding: 15px;
    border-radius: 10px;
    box-shadow: 8px 8px 20px rgba(0,0,0,0.25);
    position: relative;
}

/* LOADING TEXT */
.loading {
    position: absolute;
    top: 5px;
    right: 15px;
    color: green;
    font-size: 14px;
}

/* DOWNLOAD BUTTON */
.download-btn {
    display: none;
    position: absolute;
    top: 5px;
    right: 15px;
    background: #e3a373;
    border: none;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
}

/* TABLE WRAPPER (SCROLL) */
.table-wrapper {
    overflow-x: auto;
}

/* TABLE */
table {
    width: 100%;
    border-collapse: collapse;
    background: #cfcfcf;
}

/* HEADER */
th {
    border: 1px solid #000;
    padding: 8px;
    font-weight: bold;
    background: #cfcfcf;
}

/* BODY */
td {
    border: 1px solid #000;
    padding: 6px;
    text-align: center;
}

/* COLUMN WIDTH */
th:nth-child(1), td:nth-child(1) { width: 50px; }
th:nth-child(2), td:nth-child(2) { width: 150px; }
th:nth-child(3), td:nth-child(3) { width: 150px; }

</style>
</head>

<body>

<div class="container">

    <div class="loading" id="loadingText">Loading.......</div>
    <button class="download-btn" id="downloadBtn">Download Excel</button>

    <div class="table-wrapper">
        <table id="reportTable">
            <thead>
                <tr>
                    <th>Sl No</th>
                    <th>FPS ID</th>
                    <th>FPS Name</th>
                    <th>New RC count</th>
                    <th>Units</th>
                    <th>Add units</th>
                    <th>Total Units</th>
                    <th>Ratio</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Data will come here -->
            </tbody>
        </table>
    </div>

</div>

<script>

const url = "https://script.google.com/macros/s/AKfycbxUUuOfgvi5n0ltz6BjsLaBDKze3c56T7RNncBC_NzvurYwIPE5iSMPxZqnRQLMsRBE/exec?key=mySecret1774123";

fetch(url)
.then(res => res.json())
.then(data => {

    let tableBody = document.getElementById("tableBody");

    let fpsData = {};
    let index = 1;

    data.forEach(row => {

        let fpsId = row["F.P.S Code 13050050......."];
        let fpsName = row["FPS Name"];
        let type = row["Application type (NEW or ADD RC)"];
        let members = parseInt(row["Total Number of included Members"]) || 0;

        if (!fpsId) return;

        type = type ? type.toString().toUpperCase().trim() : "";

        if (!fpsData[fpsId]) {
            fpsData[fpsId] = {
                name: fpsName,
                newCount: 0,
                addUnits: 0,
                totalUnits: 0
            };
        }

        if (type.includes("NEW")) {
            fpsData[fpsId].newCount += 1;
            fpsData[fpsId].totalUnits += members;
        }

        if (type.includes("ADD")) {
            fpsData[fpsId].addUnits += members;
            fpsData[fpsId].totalUnits += members;
        }

    });

    // ADD ROWS
    Object.entries(fpsData).forEach(([id, val]) => {

        let ratio = val.addUnits ? (val.totalUnits / val.addUnits).toFixed(2) : 0;

        let row = `
            <tr>
                <td>${index++}</td>
                <td>${id}</td>
                <td>${val.name || ""}</td>
                <td>${val.newCount}</td>
                <td>${val.totalUnits}</td>
                <td>${val.addUnits}</td>
                <td>${val.totalUnits}</td>
                <td>${ratio}</td>
            </tr>
        `;

        tableBody.innerHTML += row;

    });

    // HIDE LOADING
    document.getElementById("loadingText").style.display = "none";

    // SHOW DOWNLOAD BUTTON
    document.getElementById("downloadBtn").style.display = "block";

});


// DOWNLOAD EXCEL
document.getElementById("downloadBtn").addEventListener("click", function () {

    let table = document.getElementById("reportTable").outerHTML;

    let blob = new Blob([table], { type: "application/vnd.ms-excel" });
    let url = URL.createObjectURL(blob);

    let a = document.createElement("a");
    a.href = url;
    a.download = "report.xls";
    a.click();
});

</script>

</body>
</html>
