<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Report Page</title>
  <style>
    body {
      background: #e5e5e5;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 90%;
      margin: 40px auto;
      background: #ddd;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 5px 10px rgba(0,0,0,0.2);
      position: relative;
    }

    .loading {
      position: absolute;
      top: 10px;
      right: 20px;
      color: green;
      font-size: 14px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th {
      background: #4a73b8;
      color: white;
      padding: 10px;
      border: 1px solid #2c4c8a;
      text-align: center;
    }

    td {
      padding: 8px;
      border: 1px solid #8aa4d0;
      text-align: center;
    }

    tr:nth-child(even) {
      background: #cfd8e6;
    }

    tr:nth-child(odd) {
      background: #e8eef8;
    }

    .grand {
      font-weight: bold;
      background: #b7c4dc;
    }

    .btn {
      display: block;
      margin: 20px auto;
      background: green;
      color: white;
      padding: 10px 25px;
      border-radius: 5px;
      border: none;
      font-size: 16px;
      cursor: pointer;
    }

    .btn:hover {
      background: darkgreen;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="loading" id="loading">Loading.......</div>

  <table id="reportTable">
    <thead>
      <tr>
        <th>Sl No</th>
        <th>GP Name/Ward No</th>
        <th>New RC count</th>
        <th>New Units</th>
        <th>Add Units</th>
        <th>Total Units</th>
      </tr>
    </thead>

    <tbody id="tableBody">
      <!-- Data yaha aayega -->
    </tbody>

    <tfoot>
      <tr class="grand">
        <td colspan="2">Grand Total</td>
        <td id="totalRC">0</td>
        <td id="totalNew">0</td>
        <td id="totalAdd">0</td>
        <td id="totalUnits">0</td>
      </tr>
    </tfoot>
  </table>

  <button class="btn" onclick="downloadCSV()">Download</button>
</div>

<script>
async function loadData() {
  try {
    const res = await fetch("/api/report"); // tumhara Vercel API
    const data = await res.json();

    const tbody = document.getElementById("tableBody");

    let totalRC = 0, totalNew = 0, totalAdd = 0, totalUnits = 0;

    data.forEach((row, index) => {
      const tr = document.createElement("tr");

      tr.innerHTML = `
        <td>${index + 1}</td>
        <td>${row.gp}</td>
        <td>${row.rc}</td>
        <td>${row.new_units}</td>
        <td>${row.add_units}</td>
        <td>${row.total_units}</td>
      `;

      tbody.appendChild(tr);

      totalRC += row.rc;
      totalNew += row.new_units;
      totalAdd += row.add_units;
      totalUnits += row.total_units;
    });

    document.getElementById("totalRC").innerText = totalRC;
    document.getElementById("totalNew").innerText = totalNew;
    document.getElementById("totalAdd").innerText = totalAdd;
    document.getElementById("totalUnits").innerText = totalUnits;

    document.getElementById("loading").innerText = "";
  } catch (err) {
    console.error(err);
    document.getElementById("loading").innerText = "Error loading data";
  }
}

function downloadCSV() {
  let csv = [];
  let rows = document.querySelectorAll("table tr");

  rows.forEach(row => {
    let cols = row.querySelectorAll("td, th");
    let rowData = [];

    cols.forEach(col => rowData.push(col.innerText));
    csv.push(rowData.join(","));
  });

  let blob = new Blob([csv.join("\n")], { type: "text/csv" });
  let url = window.URL.createObjectURL(blob);

  let a = document.createElement("a");
  a.href = url;
  a.download = "report.csv";
  a.click();
}

loadData();
</script>

</body>
</html>
