<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DEO Data Entry</title>

<style>
body { font-family:"Bookman Old Style"; background:#dcdcdc; margin:0; }

.container { width:800px; margin:30px auto; }
.row { margin:12px 0; }
.flex { display:flex; gap:20px; }
label { font-size:17px; }

input,select{
  padding:6px;
  border:1px solid #ccc;
  border-radius:4px;
}

.locked{ background:#eee; pointer-events:none; }

.yellow-bar{
  background:#ffc107;
  padding:8px;
  text-align:center;
  font-weight:bold;
  margin:20px 0;
}

/* ✅ BUTTON */
#submitBtn{
  background:#28a745;
  color:white;
  padding:8px 30px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  position:relative;
}

#submitBtn.loading{
  pointer-events:none;
  opacity:0.7;
}

/* ✅ REAL SPINNER */
#submitBtn.loading::after{
  content:"";
  width:18px;
  height:18px;
  border:3px solid white;
  border-top:3px solid transparent;
  border-radius:50%;
  position:absolute;
  right:10px;
  top:50%;
  transform:translateY(-50%);
  animation:spin 0.7s linear infinite;
}

@keyframes spin{
  100%{transform:translateY(-50%) rotate(360deg);}
}

/* STATUS */
#appStatus{ font-size:13px; font-weight:bold; margin-left:10px; }
.status-checking{color:orange;}
.status-ok{color:green;}
.status-dup{color:red;}

/* TOAST */
.toast{
 position:fixed; top:15px; right:15px;
 padding:10px 15px;
 border-radius:5px;
 opacity:0;
 transition:.3s;
}
.toast.show{opacity:1;}
.toast-success{background:green;color:#fff;}
.toast-error{background:red;color:#fff;}

.main-form{display:none;}
</style>
</head>

<body>

<div class="container">

<div class="row">
<label>Application Type *</label><br>
<select id="appType">
<option value="">Select</option>
<option value="NEW">NEW (20)</option>
<option value="ADD">ADD (21)</option>
</select>
</div>

<div id="mainForm" class="main-form">

<form id="dataForm">

<div class="row">
<label>Application Number *</label><br>
<input id="applicationNumber">
<span id="appStatus"></span>
</div>

<div class="row">
<label>Inspector *</label><br>
<select id="inspector">
<option value="">Select</option>
<option>Abhijit Bora</option>
</select>
</div>

<div class="row flex">
<input id="deo" placeholder="DEO Name">
<input type="date" id="date">
</div>

<div class="row">
<input id="mobile" placeholder="Mobile">
</div>

<div class="row flex">
<input id="hof" placeholder="HOF">
<input id="gp" placeholder="GP">
</div>

<div class="row">
<input id="totalMembers" type="number">
</div>

<div class="yellow-bar">FPS</div>

<div class="row flex">
<input id="fpsCode" placeholder="Code">
<input id="fpsName" class="locked">
</div>

<div class="row flex">
<input id="gpss" class="locked">
<input id="areaOfficer" class="locked">
</div>

<div class="row">
<input id="lacManual" class="locked">
</div>

<button id="submitBtn">Submit</button>
<button type="button" id="resetBtn">Reset</button>

</form>
</div>
</div>

<div id="toast" class="toast"><span class="toast-message"></span></div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbw02vDrYaKFL3hA3XZBBf978uh5KrGuwKMbdSYAVPNbT5b6wFgM1EyV4RE_zHV0PRSQqQ/exec";

let fpsData=[];
let debounceTimer;
let currentAppType="";

// TOAST
function showToast(msg,ok=true){
 const t=document.getElementById("toast");
 t.querySelector(".toast-message").textContent=msg;
 t.className="toast show "+(ok?"toast-success":"toast-error");
 setTimeout(()=>t.classList.remove("show"),2000);
}

// APP TYPE
appType.onchange=function(){
 currentAppType=this.value;
 mainForm.style.display=this.value?"block":"none";
 applicationNumber.value="";
}

// LIVE CHECK
applicationNumber.oninput=function(){

 let v=this.value.trim();
 let status=appStatus;

 clearTimeout(debounceTimer);

 if(!v) return;

 if(!v.startsWith("RC")){
  status.textContent="Start with RC";
  status.className="status-dup";
  return;
 }

 let len=currentAppType==="NEW"?20:21;

 if(v.length<len){
  status.textContent="Typing...";
  status.className="status-checking";
  return;
 }

 status.textContent="Checking...";
 status.className="status-checking";

 debounceTimer=setTimeout(()=>{
 fetch(API_URL+"?action=checkDuplicate&appNum="+v)
 .then(r=>r.json())
 .then(d=>{
  if(d.exists){
    status.textContent="Duplicate ❌";
    status.className="status-dup";
  }else{
    status.textContent="Available ✅";
    status.className="status-ok";
  }
 })
 },300);
}

// FPS FAST
fetch(API_URL+"?action=getFPS")
.then(r=>r.json())
.then(d=>fpsData=d);

fpsCode.oninput=function(){
 let f=fpsData.find(x=>x.code==this.value);
 if(f){
  fpsName.value=f.fpsName;
  gpss.value=f.gpss;
  areaOfficer.value=f.areaOfficer;
  lacManual.value=f.lac;
 }
}

// VALIDATION
function validate(){
 const fields=["applicationNumber","inspector","deo","date","mobile","hof","gp","totalMembers","fpsCode"];
 for(let f of fields){
  if(!document.getElementById(f).value.trim()){
    showToast("All fields required!",false);
    return false;
  }
 }
 if(!/^\d{10}$/.test(mobile.value)){
  showToast("Invalid mobile",false);
  return false;
 }
 return true;
}

// SUBMIT
dataForm.onsubmit=e=>{
 e.preventDefault();
 if(!validate()) return;

 submitBtn.classList.add("loading");

 fetch(API_URL,{
  method:"POST",
  body:new FormData(dataForm)
 })
 .then(r=>r.json())
 .then(res=>{
  if(res.status==="Success"){
    showToast("Saved ✅",true);
    dataForm.reset();
    mainForm.style.display="none";
  }else{
    showToast("Duplicate ❌",false);
  }
 })
 .catch(()=>showToast("Error ❌",false))
 .finally(()=>submitBtn.classList.remove("loading"));
};

// RESET
resetBtn.onclick=()=>{
 dataForm.reset();
 mainForm.style.display="none";
}
</script>

</body>
</html>
