<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Data Entry Form</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- Toast -->
<div id="toast" class="toast">
  <span class="toast-message"></span>
</div>

<div class="top-title">
This form is only for maintaining the DEO work record<br>
It is not a SmartPDS portal data entry page
</div>

<div class="title">
Please complete the data entry process first<br>
<span class="subtitle">Enter application number here</span>
</div>

<div class="container">
<form id="dataForm">

<div class="row">
<label>Inspector:</label>
<select id="inspector" required style="width:350px;">
<option value="">Select</option>
<option>Abhijit Bora</option>
<option>Durga Bodo</option>
<option>Mausam Zinnat</option>
<option>Mausumi Bora</option>
<option>Sanjiv Sarma</option>
<option>Santonu Bordoloi</option>
</select>
</div>

<div class="row">
<label>Application Type:</label>
<select id="appType" required style="width:350px;">
<option value="">Select</option>
<option value="NEW">NEW</option>
<option value="ADD">ADD</option>
</select>
</div>

<div class="row">
<label>Application Number:</label>
<div style="position:relative; width:350px;">
<input type="text" id="applicationNumber" maxlength="21" style="width:100%; padding-right:120px;">
<span id="appStatus"></span>
</div>
</div>

<div class="row flex">
<div>
<label>DEO Name:</label>
<input type="text" id="deo" required style="width:200px;">
</div>
<div>
<label>Date:</label>
<input type="date" id="date" required>
</div>
</div>

<div class="row">
<label>Mobile:</label>
<input type="text" id="mobile" maxlength="10" required>
</div>

<div class="row flex">
<div>
<label>Head of Family:</label>
<input type="text" id="hof" required>
</div>
<div>
<label>GP:</label>
<input type="text" id="gp" required>
</div>
</div>

<div class="row">
<label>Total Members:</label>
<input type="number" id="totalMembers" min="1" required>
</div>
<div class="yellow-bar">

Fair Price Shop Detail

</div>

<div class="note">

<b>N.B.:</b> You can fill only FPS Code

<div class="note">

<b>N.B.:</b> You can fill only FPS Code

</div>

<div class="row flex">

<div>

<label>F.P.S Code</label>

<input type="text" id="fpsCode" placeholder="130500500001" required style="width:200px;">

</div>

<div>

<label>FPS Name</label>

<input type="text" id="fpsName" readonly class="locked" style="width:250px;">

</div>

</div>

<div class="row flex">

<div>

<label>Name of GPSS</label>

<input type="text" id="gpss" readonly class="locked" style="width:390px;">

</div>

<div>

<label>Area Officer</label>

<input type="text" id="areaOfficer" readonly class="locked" style="width:280px;">

</div>

</div>

<div class="row">

<label>LAC Name</label>

<input type="text" id="lacManual" readonly class="locked" style="width:300px;">

</div>


<div class="button-area">
<button id="submitBtn" type="submit">
<span class="btn-text">Submit</span>
<span class="spinner" style="display:none;">↻</span>
</button>

<button type="reset" class="reset-btn">Reset</button>
</div>

</form>
</div>

<script src="script.js"></script>
</body>
</html>
